<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ScentMatch | Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#111827',
                        secondary: '#6B7280',
                        accent: '#2563EB'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gradient-to-br from-slate-100 via-white to-slate-200 min-h-screen flex items-center justify-center">

<div class="w-full max-w-md px-6">

    <!-- Logo -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold mt-5 text-gray-900">
            ScentMatch
        </h1>

        <p class="text-gray-500 mt-2">
            Admin Dashboard Login
        </p>

    </div>

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8">

        <form th:action="@{/login}" method="post" class="space-y-5">

            <!-- Username -->
            <div>

                <label class="block mb-2 text-sm font-semibold text-gray-700">
                    Username
                </label>

                <input
                        type="text"
                        name="username"
                        required
                        placeholder="Enter username"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">

            </div>

            <!-- Password -->
            <div>

                <label class="block mb-2 text-sm font-semibold text-gray-700">
                    Password
                </label>

                <input
                        type="password"
                        name="password"
                        required
                        placeholder="Enter password"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">

            </div>

            <!-- Error -->
            <div
                    th:if="${error}"
                    class="bg-red-100 border border-red-300 text-red-700 rounded-xl p-3 text-sm text-center"
                    th:text="${error}">
            </div>

            <!-- Button -->
            <button
                    type="submit"
                    class="w-full bg-primary hover:bg-black text-white font-semibold py-3 rounded-xl transition duration-300 shadow-lg">

                Login

            </button>

        </form>

    </div>

    <!-- Back -->
    <div class="text-center mt-6">
        <a href="/"
           class="text-gray-600 hover:text-blue-600 transition font-medium">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
