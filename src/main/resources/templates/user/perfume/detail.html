<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${perfume.name + ' - ScentMatch'}">Detail Perfume</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

<!-- Navbar -->
<header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <a th:href="@{/}" class="text-2xl font-bold text-blue-600">ScentMatch</a>

        <nav class="flex items-center gap-6 text-sm font-medium">
            <a th:href="@{/}" class="text-gray-700 hover:text-blue-600">Home</a>
            <a th:href="@{/perfumes}" class="text-gray-700 hover:text-blue-600">Perfumes</a>
        </nav>
    </div>
</header>

<section class="max-w-6xl mx-auto px-4 py-12">
    <a th:href="@{/perfumes}" class="inline-block mb-6 text-blue-600 hover:underline">
        ← Kembali ke daftar perfume
    </a>

    <div class="bg-white rounded-2xl shadow overflow-hidden">
        <div class="grid md:grid-cols-2 gap-0">

            <!-- Image -->
            <div class="bg-gray-100 min-h-[420px] flex items-center justify-center overflow-hidden">
                <img th:if="${perfume.imageUrl != null and !#strings.isEmpty(perfume.imageUrl)}"
                     th:src="${perfume.imageUrl}"
                     th:alt="${perfume.name}"
                     class="w-full h-full object-cover">

                <div th:unless="${perfume.imageUrl != null and !#strings.isEmpty(perfume.imageUrl)}"
                     class="text-gray-400 text-sm">
                    No Image
                </div>
            </div>

            <!-- Detail -->
            <div class="p-8 md:p-10">
                <div class="flex flex-wrap gap-2 mb-4">
                    <span class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full"
                          th:text="${perfume.category != null ? perfume.category.name : 'No Category'}"></span>

                    <span class="text-xs bg-pink-100 text-pink-700 px-3 py-1 rounded-full"
                          th:text="${perfume.gender != null ? perfume.gender : 'Unisex'}"></span>
                </div>

                <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2"
                    th:text="${perfume.name}"></h1>

                <p class="text-lg text-gray-500 mb-6"
                   th:text="${perfume.brand != null ? perfume.brand.name : 'No Brand'}"></p>

                <div class="grid sm:grid-cols-2 gap-4 mb-8">
                    <div class="bg-gray-50 rounded-xl p-4">
                        <p class="text-sm text-gray-500">Price</p>
                        <p class="text-lg font-semibold text-gray-800"
                           th:text="${perfume.price != null ? 'Rp ' + perfume.price : '-'}"></p>
                    </div>

                    <div class="bg-gray-50 rounded-xl p-4">
                        <p class="text-sm text-gray-500">Size</p>
                        <p class="text-lg font-semibold text-gray-800"
                           th:text="${perfume.sizeMl != null ? perfume.sizeMl + ' ml' : '-'}"></p>
                    </div>
                </div>

                <div class="space-y-5">
                    <div>
                        <h2 class="font-semibold text-gray-800 mb-2">Top Notes</h2>
                        <p class="text-gray-600 leading-relaxed"
                           th:text="${perfume.topNotes != null and !#strings.isEmpty(perfume.topNotes) ? perfume.topNotes : '-'}"></p>
                    </div>

                    <div>
                        <h2 class="font-semibold text-gray-800 mb-2">Middle Notes</h2>
                        <p class="text-gray-600 leading-relaxed"
                           th:text="${perfume.middleNotes != null and !#strings.isEmpty(perfume.middleNotes) ? perfume.middleNotes : '-'}"></p>
                    </div>

                    <div>
                        <h2 class="font-semibold text-gray-800 mb-2">Base Notes</h2>
                        <p class="text-gray-600 leading-relaxed"
                           th:text="${perfume.baseNotes != null and !#strings.isEmpty(perfume.baseNotes) ? perfume.baseNotes : '-'}"></p>
                    </div>

                    <div>
                        <h2 class="font-semibold text-gray-800 mb-2">Description</h2>
                        <p class="text-gray-600 leading-relaxed"
                           th:text="${perfume.description != null and !#strings.isEmpty(perfume.description) ? perfume.description : '-'}"></p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

<footer class="bg-white border-t mt-10">
    <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-500">
        © 2026 ScentMatch — Temukan aroma favoritmu.
    </div>
</footer>

</body>
</html>
