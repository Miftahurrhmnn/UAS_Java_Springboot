<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Perfume</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="max-w-7xl mx-auto py-10 px-4">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Daftar Perfume</h1>
            <p class="text-gray-500">Kelola data parfum</p>
        </div>
        <a th:href="@{/admin/perfumes/create}"
           class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow">
            + Tambah Perfume
        </a>
    </div>

    <div class="bg-white rounded-xl shadow overflow-hidden">
        <table class="w-full border-collapse text-sm">
            <thead class="bg-gray-50">
            <tr>
                <th class="text-left px-4 py-3">No</th>
                <th class="text-left px-4 py-3">Nama</th>
                <th class="text-left px-4 py-3">Brand</th>
                <th class="text-left px-4 py-3">Category</th>
                <th class="text-left px-4 py-3">Price</th>
                <th class="text-left px-4 py-3">Size</th>
                <th class="text-left px-4 py-3">Gender</th>
                <th class="text-left px-4 py-3">Stock</th>
                <th class="text-center px-4 py-3">Aksi</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(perfumes)}">
                <td colspan="9" class="text-center py-6 text-gray-500">
                    Belum ada data parfum.
                </td>
            </tr>

            <tr th:each="perfume, stat : ${perfumes}" class="border-t hover:bg-gray-50">
                <td class="px-4 py-3" th:text="${stat.count}"></td>
                <td class="px-4 py-3 font-medium" th:text="${perfume.name}"></td>
                <td class="px-4 py-3" th:text="${perfume.brand.name}"></td>
                <td class="px-4 py-3" th:text="${perfume.category.name}"></td>
                <td class="px-4 py-3" th:text="${perfume.price}"></td>
                <td class="px-4 py-3" th:text="${perfume.sizeMl + ' ml'}"></td>
                <td class="px-4 py-3" th:text="${perfume.gender}"></td>
                <td class="px-4 py-3" th:text="${perfume.stock}"></td>
                <td class="px-4 py-3 text-center">
                    <div class="flex justify-center gap-2">
                        <a th:href="@{/admin/perfumes/edit/{id}(id=${perfume.id})}"
                        class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded-lg text-sm">
                            Edit
                        </a>
    
                        <a th:href="@{/admin/perfumes/delete/{id}(id=${perfume.id})}"
                           onclick="return confirm('Yakin ingin menghapus parfum ini?')"
                           class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-sm">
                            Hapus
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
