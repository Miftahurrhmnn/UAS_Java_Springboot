<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${perfume.id != null ? 'Edit Perfume' : 'Tambah Perfume'}">Form Perfume</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f9;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 24px;
      color: #222;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    input, select, textarea {
      padding: 12px 14px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17,24,39,0.08);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }

    .btn {
      text-decoration: none;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: #111827;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <h1 th:text="${perfume.id != null ? 'Edit Perfume' : 'Tambah Perfume'}">Form Perfume</h1>

  <form th:action="@{/admin/perfumes/save}" th:object="${perfume}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div class="grid">
      <div class="form-group">
        <label>Nama Perfume</label>
        <input type="text" th:field="*{name}" placeholder="Contoh: Dior Sauvage" required>
      </div>

      <div class="form-group">
        <label>Brand</label>
        <select name="brandId" required>
          <option value="">-- Pilih Brand --</option>
          <option th:each="brand : ${brands}"
                  th:value="${brand.id}"
                  th:text="${brand.name}"
                  th:selected="${perfume.brand != null and perfume.brand.id == brand.id}">
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Category</label>
        <select name="categoryId" required>
          <option value="">-- Pilih Category --</option>
          <option th:each="category : ${categories}"
                  th:value="${category.id}"
                  th:text="${category.name}"
                  th:selected="${perfume.category != null and perfume.category.id == category.id}">
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Harga</label>
        <input type="number" th:field="*{price}" placeholder="Contoh: 350000" required>
      </div>

      <div class="form-group">
        <label>Size (ml)</label>
        <input type="number" th:field="*{sizeMl}" placeholder="Contoh: 100">
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select th:field="*{gender}">
          <option value="">-- Pilih Gender --</option>
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Unisex">Unisex</option>
        </select>
      </div>

      <div class="form-group">
        <label>Stock</label>
        <input type="number" th:field="*{stock}" min="0" placeholder="Contoh: 10" required>
      </div>

      <div class="form-group full">
        <label>Image URL</label>
        <input type="text" th:field="*{imageUrl}" placeholder="https://...">
      </div>

      <div class="form-group full">
        <label>Top Notes</label>
        <textarea th:field="*{topNotes}" placeholder="Contoh: Bergamot, Lemon"></textarea>
      </div>

      <div class="form-group full">
        <label>Middle Notes</label>
        <textarea th:field="*{middleNotes}" placeholder="Contoh: Lavender, Jasmine"></textarea>
      </div>

      <div class="form-group full">
        <label>Base Notes</label>
        <textarea th:field="*{baseNotes}" placeholder="Contoh: Amber, Musk"></textarea>
      </div>

      <div class="form-group full">
        <label>Description</label>
        <textarea th:field="*{description}" placeholder="Deskripsi parfum"></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary">Simpan</button>
      <a th:href="@{/admin/perfumes}" class="btn btn-secondary">Kembali</a>
    </div>
  </form>
</div>
</body>
</html>
