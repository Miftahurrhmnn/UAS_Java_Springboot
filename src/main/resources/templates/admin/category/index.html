<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Category</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="max-w-5xl mx-auto py-10 px-4">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Daftar Category</h1>
            <p class="text-gray-500">Kelola data kategori parfum</p>
        </div>

        <div class="flex justify-center items-center gap-2">
            <a th:href="@{/admin/}"
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow">
                    Dashboard Admin
                </a>
            <a th:href="@{/admin/categories/create}"
               class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow">
                + Tambah Category
            </a>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow overflow-hidden">
        <table class="w-full border-collapse">
            <thead class="bg-gray-50">
                <tr>
                    <th class="text-left px-6 py-4 font-semibold text-gray-700">No</th>
                    <th class="text-left px-6 py-4 font-semibold text-gray-700">Nama Category</th>
                    <th class="text-center px-6 py-4 font-semibold text-gray-700">Aksi</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="3" class="text-center py-6 text-gray-500">
                        Belum ada data category.
                    </td>
                </tr>

                <tr th:each="category, stat : ${categories}" class="border-t hover:bg-gray-50">
                    <td class="px-6 py-4" th:text="${stat.count}"></td>
                    <td class="px-6 py-4 font-medium text-gray-800" th:text="${category.name}"></td>
                    <td class="px-6 py-4 text-center">
                        <a th:href="@{/admin/categories/delete/{id}(id=${category.id})}"
                           onclick="return confirm('Yakin ingin menghapus category ini?')"
                           class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-sm">
                            Hapus
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
