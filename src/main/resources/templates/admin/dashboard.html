<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - ScentMatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="max-w-7xl mx-auto py-10 px-4">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Admin Dashboard</h1>
        <p class="text-gray-500">Ringkasan data parfum di ScentMatch</p>
    </div>

    <!-- Card Statistik -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <!-- Total Perfume -->
        <div class="bg-white rounded-2xl shadow p-6 border-l-4 border-blue-500">
            <p class="text-sm text-gray-500 mb-2">Total Perfume</p>
            <h2 class="text-3xl font-bold text-gray-800" th:text="${totalPerfumes}">0</h2>
        </div>

        <!-- Total Brand -->
        <div class="bg-white rounded-2xl shadow p-6 border-l-4 border-green-500">
            <p class="text-sm text-gray-500 mb-2">Total Brand</p>
            <h2 class="text-3xl font-bold text-gray-800" th:text="${totalBrands}">0</h2>
        </div>

        <!-- Total Category -->
        <div class="bg-white rounded-2xl shadow p-6 border-l-4 border-purple-500">
            <p class="text-sm text-gray-500 mb-2">Total Category</p>
            <h2 class="text-3xl font-bold text-gray-800" th:text="${totalCategories}">0</h2>
        </div>
    </div>

    <!-- Menu Navigasi -->
    <div class="flex flex-wrap gap-3 mb-8">
        <a th:href="@{/admin/perfumes}"
           class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow">
            Kelola Perfume
        </a>

        <a th:href="@{/admin/brands}"
           class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow">
            Kelola Brand
        </a>

        <a th:href="@{/admin/categories}"
           class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg shadow">
            Kelola Category
        </a>
    </div>

    <!-- Tabel Perfume -->
    <div class="bg-white rounded-2xl shadow overflow-hidden">
        <div class="px-6 py-4 border-b">
            <h2 class="text-xl font-semibold text-gray-800">Daftar Perfume</h2>
            <p class="text-sm text-gray-500">Data parfum yang tersimpan di sistem</p>
        </div>

        <table class="w-full text-sm border-collapse">
            <thead class="bg-gray-50">
            <tr>
                <th class="text-left px-4 py-3">No</th>
                <th class="text-left px-4 py-3">Nama</th>
                <th class="text-left px-4 py-3">Brand</th>
                <th class="text-left px-4 py-3">Category</th>
                <th class="text-left px-4 py-3">Price</th>
                <th class="text-left px-4 py-3">Gender</th>
            </tr>
            </thead>

            <tbody>
            <tr th:if="${#lists.isEmpty(perfumes)}">
                <td colspan="6" class="text-center py-6 text-gray-500">
                    Belum ada data perfume.
                </td>
            </tr>

            <tr th:each="perfume, stat : ${perfumes}" class="border-t hover:bg-gray-50">
                <td class="px-4 py-3" th:text="${stat.count}"></td>
                <td class="px-4 py-3 font-medium" th:text="${perfume.name}"></td>
                <td class="px-4 py-3" th:text="${perfume.brand.name}"></td>
                <td class="px-4 py-3" th:text="${perfume.category.name}"></td>
                <td class="px-4 py-3" th:text="${perfume.price}"></td>
                <td class="px-4 py-3" th:text="${perfume.gender}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
